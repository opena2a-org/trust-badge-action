name: 'OpenA2A Trust Badge'
description: 'Automatically adds and updates the OpenA2A trust score badge in your README'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  readme-path:
    description: 'Path to README file'
    required: false
    default: 'README.md'
  package-name:
    description: 'Package name to look up (auto-detected from package.json if not provided)'
    required: false
  package-source:
    description: 'Package source: npm, pypi, github'
    required: false
    default: 'npm'
  registry-url:
    description: 'OpenA2A Registry URL'
    required: false
    default: 'https://api.oa2a.org'
  create-pr:
    description: 'Create a PR instead of committing directly (use if you have branch protection)'
    required: false
    default: 'false'
  auto-merge:
    description: 'Automatically merge the PR after creation (only applies when create-pr is true)'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for commits and PRs, used when the GITHUB_TOKEN environment variable is not set. Without either, the README is updated in the workspace only.'
    required: false

outputs:
  trust-score:
    description: 'Trust score as the registry lookup returns it: a number from 0 to 1, not rounded'
  trust-level:
    description: 'Current trust level'
  badge-url:
    description: 'URL of the trust badge SVG'
  profile-url:
    description: 'URL the badge links to: the registry trust lookup for the package'
  updated:
    description: 'Whether the README was updated'

runs:
  using: 'node20'
  main: 'dist/index.js'
